<svg xmlns="http://www.w3.org/2000/svg" width="880" height="336" viewBox="0 0 880 336" role="img"><rect x="0.5" y="0.5" width="879" height="335" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/><text x="44" y="84" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="42" font-weight="700" text-anchor="start">scaffold-bench</text><text x="44" y="116" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" text-anchor="start">Do frontier coding agents still need the scaffolding we build around them?</text><rect x="680" y="52" width="156" height="28" rx="14" fill="#ffffff" stroke="#d1d9e0"/><circle cx="698" cy="66" r="4" fill="#1f6feb"><animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/></circle><text x="710" y="70" fill="#59636e" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" text-anchor="start">clean rerun live</text><g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.194;1" dur="0.62s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;0.16 1 0.3 1"/><animateTransform attributeName="transform" type="translate" values="0 12;0 12;0 0" keyTimes="0;0.146;1" dur="0.82s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;0.16 1 0.3 1"/><rect x="44.0" y="150" width="254.7" height="94" rx="8" fill="#ffffff" stroke="#d1d9e0"/><text x="62.0" y="194" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="34" font-weight="700" text-anchor="start">5</text><text x="62.0" y="216" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" text-anchor="start">rounds, every one</text><text x="62.0" y="232" fill="#818b98" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" text-anchor="start">pre-registered before the run</text></g><g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.333;1" dur="0.75s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;0.16 1 0.3 1"/><animateTransform attributeName="transform" type="translate" values="0 12;0 12;0 0" keyTimes="0;0.263;1" dur="0.95s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;0.16 1 0.3 1"/><rect x="312.7" y="150" width="254.7" height="94" rx="8" fill="#ffffff" stroke="#d1d9e0"/><text x="330.66666666666663" y="194" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="34" font-weight="700" text-anchor="start">520</text><text x="330.66666666666663" y="216" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" text-anchor="start">graded arm-outcomes</text><text x="330.66666666666663" y="232" fill="#818b98" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" text-anchor="start">across rounds 1-5</text></g><g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.432;1" dur="0.88s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;0.16 1 0.3 1"/><animateTransform attributeName="transform" type="translate" values="0 12;0 12;0 0" keyTimes="0;0.352;1" dur="1.08s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;0.16 1 0.3 1"/><rect x="581.3" y="150" width="254.7" height="94" rx="8" fill="#ffffff" stroke="#d1d9e0"/><text x="599.3333333333333" y="194" fill="#c2405f" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="34" font-weight="700" text-anchor="start">2 of 5</text><text x="599.3333333333333" y="216" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" text-anchor="start">rounds won by the scaffold,</text><text x="599.3333333333333" y="232" fill="#818b98" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" text-anchor="start">and 1 cell caught cheating</text></g><line x1="44" y1="274" x2="836" y2="274" stroke="#d1d9e0"/><text x="44" y="300" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start">Every time I improved the experiment, my own result got weaker.</text><text x="44" y="320" fill="#818b98" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="start">Graded by the official harness, never by the agent. In round 5 that is how one arm got caught cheating.</text></svg>